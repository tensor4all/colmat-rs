on:
  push:
    branches:
      - dev
      - main
  pull_request:

name: Assess Code Quality

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@master

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Same version as rust-toolchain.toml, which is what cargo runs here anyway.
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Formatting check
        run: cargo fmt --all -- --check
        # want to get all quality issues
        continue-on-error: true

        # colmat reached zero warnings on 1.96.0 (tensor4all/colmat-rs#183), so the whole
        # workspace is a gate now. A crate that regresses fails here rather than joining a
        # warning count nobody reads.
      - name: Lint (blocking)
        run: cargo clippy --workspace --all-targets -- -D warnings
