name: coverage

# Nightly only (#313): no push or pull_request trigger. The instrumented run died from the OOM killer
# in `parallel_path_is_bit_identical*` on documentation-only PRs, so a red `coverage` check on a PR
# said nothing about the diff. A red result here means coverage fell below the floor, or this one job
# broke on its own; it is not a status to require on `main` (require `ci`'s jobs instead).
on:
  schedule:
    - cron: '41 2 * * *' # nightly, 02:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-nightly
  cancel-in-progress: false

jobs:
  # Coverage floor (#184). `cargo llvm-cov` over the whole workspace, failing below a checked-in
  # number. The number is a measurement, not an aim: on 2026-11-14 this exact command ran 1089 tests
  # (166 `#[ignore]`d ones skipped) and covered 79272 of 95861 lines = 82.694 %, twice with identical
  # counts on a 32-thread x86_64 host and once on 4 CPUs. The table's `Lines` column prints the same
  # ratio as 82.69 %; it is the `Lines` column, not `Regions` (85.21 %) or `Functions` (73.61 %).
  #
  # Raise the floor when coverage improves. Lowering it needs a maintainer's decision stated in the PR,
  # and bumping the toolchain pin below means re-measuring it in the same PR. Nothing is excluded:
  # `faer-macros` reads 0 % because proc-macro code runs inside rustc, and `faer-ffi`/`faer-traits` are
  # covered by their own tests, so no crate is hidden behind an `--ignore-filename-regex`.
  #
  # The toolchain is pinned twice on purpose: `rust-toolchain.toml` outranks the action and carries
  # only `clippy`/`rustfmt`, so a channel bump there would otherwise run this job on a compiler without
  # `llvm-tools-preview` and move the number. Doctests are not measured (nextest does not run them);
  # see `docs/coverage.md`.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # One test at a time (#313): the instrumented peak is the largest single test, not a sum. Nightly,
    # so the longer wall time costs no author anything.
    timeout-minutes: 240
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          # The action tag moves; the tools it installs are the pinned part.
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151
      # The report is published twice: in the log and in the job summary, so a red check shows which
      # file moved without a rerun. `pipefail` keeps the gate's exit status through `tee`. Exact
      # uncovered line numbers are a local rerun with `--show-missing-lines` (16k lines, see
      # `docs/coverage.md`), not something to paste into every log.
      - name: Coverage floor
        run: |
          set -o pipefail
          {
            echo '```'
            cargo llvm-cov nextest --cargo-profile ci --workspace --all-targets --locked --test-threads 1 --fail-under-lines 82.694
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
