[package]
name = "faer-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
colmat = { version = "0.34.0", path = "../faer" }
# the team handle owns a pool (tensor4all/faer#333), so the C boundary names threadteam directly
threadteam = "0.6.0"
pastey = "0.2.1"

[build-dependencies]
cbindgen = { version = "0.29" }

[features]
default = ["std", "rayon", "rand", "linalg", "sparse-linalg"]
std = ["colmat/std"]
rand = ["colmat/rand"]
rayon = ["colmat/rayon", "std"]
linalg = ["colmat/linalg"]
sparse-linalg = ["colmat/sparse-linalg"]
